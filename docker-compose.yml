services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: handbase
      POSTGRES_USER: handbase
      POSTGRES_PASSWORD: handbase
    volumes:
      - handbase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handbase -d handbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_BUILD_REVISION: local
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  handbase_pgdata:
